name: Verify v0.1.8 migration

on:
  pull_request:

permissions:
  contents: read

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source migration
        run: node .github/apply-v018.cjs
      - name: Repair generated migration markers
        run: node .github/fix-v018-generated.cjs
      - name: Check generated source syntax
        working-directory: uopt
        run: npm run check
      - name: Run full tests after migration
        working-directory: uopt
        run: npm test
      - name: Verify bundled runtime after migration
        working-directory: uopt
        run: npm run verify
