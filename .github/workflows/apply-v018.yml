name: Apply verified v0.1.8 migration

on:
  push:
    branches:
      - feat/v0.1.8-ollama-safety

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.1.8-ollama-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source migration
        run: node .github/apply-v018.cjs
      - name: Repair generated migration markers
        run: node .github/fix-v018-generated.cjs
      - name: Check source syntax
        working-directory: uopt
        run: npm run check
      - name: Run full tests
        working-directory: uopt
        run: npm test
      - name: Verify bundled runtime
        working-directory: uopt
        run: npm run verify
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/apply-v018.cjs .github/fix-v018-generated.cjs .github/workflows/apply-v018.yml
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
            exit 1
          fi
          git commit -m "feat: release UOPT v0.1.8 Ollama safety"
          git push origin HEAD:feat/v0.1.8-ollama-safety
