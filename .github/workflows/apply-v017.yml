name: Apply v0.1.7 migration

on:
  push:
    branches:
      - feat/v0.1.7-translation-logging

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.1.7-translation-logging
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply v0.1.7 source migration
        run: node .github/apply-v017.cjs

      - name: Run full tests
        working-directory: uopt
        run: npm test

      - name: Verify bundled runtime
        working-directory: uopt
        run: npm run verify

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "feat: release UOPT v0.1.7 translation transparency"
          git push origin HEAD:feat/v0.1.7-translation-logging
