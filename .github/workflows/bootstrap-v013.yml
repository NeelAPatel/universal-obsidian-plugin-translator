name: Apply UOPT v0.1.3 branch

on:
  push:
    branches: [feat/v0.1.3]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.1.3
      - name: Restore verified v0.1.3 tree
        shell: bash
        run: |
          cat .bootstrap-v013/part-* | base64 -d > /tmp/uopt-v013.tar.gz
          tar -xzf /tmp/uopt-v013.tar.gz
          rm -rf .bootstrap-v013 .github/workflows/bootstrap-v013.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release UOPT v0.1.3 single-column preview UI"
          git push origin HEAD:feat/v0.1.3
