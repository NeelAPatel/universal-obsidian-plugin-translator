name: Apply UOPT v0.1.4 branch

on:
  push:
    branches: [feat/v0.1.4]
    paths:
      - '.bootstrap-v014/**'
      - '.github/workflows/bootstrap-v014.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.1.4
      - name: Restore verified v0.1.4 tree
        run: |
          set -euo pipefail
          cat .bootstrap-v014/p-* > /tmp/uopt-v014.b64
          base64 -d /tmp/uopt-v014.b64 > /tmp/uopt-v014.tar.gz
          tar -xzf /tmp/uopt-v014.tar.gz
          rm -rf .bootstrap-v014
          rm -f .github/workflows/bootstrap-v014.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: implement UOPT v0.1.4 structured diagnostics"
          git push origin HEAD:feat/v0.1.4
