name: Bootstrap UOPT source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore exact source tree
        shell: bash
        run: |
          cat .bootstrap/part-* | base64 -d | tar -xzf -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restore UOPT v0.1.2 source"
          git push
